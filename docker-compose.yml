services:
  scribe:
    build: .
    container_name: meeting-scribe
    restart: unless-stopped
    env_file: .env
    environment:
      # Timestamps in summaries follow this. Server VMs default to UTC.
      TZ: ${TZ:-UTC}
      DATA_DIR: /app/data
    volumes:
      # Recordings and transcripts must survive container rebuilds - /retry
      # depends on them, and a restart mid-meeting must not lose the audio.
      - ./data:/app/data
    # Reap zombie processes (ffmpeg subprocesses land here from M2 onward).
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
